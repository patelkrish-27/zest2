# supabase/config.toml — Zest (figma-make-app) local Supabase config
# Generated by DB pane 1.4 — follows supabase/agent-skills best practices
# See SUPABASE_SYNC.md for link/push workflow.
# project_id is injected via env SUPABASE_PROJECT_ID or `npx supabase link --project-ref <ref>`

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
image_transformation = { enabled = true }
import_path = "./storage"

[auth]
enabled = true
port = 54325
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:8443"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
enable_manual_linking = true
external.apple.enabled = false
external.azure.enabled = false
external.bitbucket.enabled = false
external.discord.enabled = false
external.facebook.enabled = false
external.figma.enabled = false
external.github.enabled = false
external.gitlab.enabled = false
external.google.enabled = false
external.kakao.enabled = false
external.keycloak.enabled = false
external.linkedin.enabled = false
external.notion.enabled = false
external.slack.enabled = false
external.spotify.enabled = false
external.twitch.enabled = false
external.twitter.enabled = false
external.workos.enabled = false
external.zoom.enabled = false
email.double_confirm_changes = false
email.enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# Project metadata — overwritten by `supabase link`
[project]
# project_id = "${SUPABASE_PROJECT_ID}"  # set via env or `supabase link`
